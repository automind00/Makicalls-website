<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(139,92,246,0.08)" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- glow blob -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.18" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(60px)"/>

  <!-- Brand dot + label -->
  <g transform="translate(80, 80)">
    <circle cx="8" cy="8" r="6" fill="#a78bfa"/>
    <text x="28" y="13" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#cbd5e1">AI ÇAĞRI MERKEZİ · 7/24 TÜRKÇE</text>
  </g>

  <!-- Wordmark -->
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="120" font-weight="800" letter-spacing="-4" fill="#ffffff">
    Maki<tspan fill="url(#accent)">Calls</tspan>
  </text>

  <!-- Headline -->
  <text x="80" y="420" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="300" fill="#cbd5e1"><tspan fill="#ffffff" font-weight="600">AI sesli asistan</tspan> telefonu açar, müşteriyi kaçırmaz.</text>

  <!-- Sub -->
  <text x="80" y="490" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Sesli arama · WhatsApp · Instagram · Web chat — tek panel</text>

  <!-- footer line -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="80" y="585" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">makicalls.com</text>
  <text x="1120" y="585" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">7/24 Türkçe cevaplar</text>
</svg>
